x-app-image: &app-image
  image: kossuma-app:latest
  build:
    context: .
    dockerfile: Dockerfile
    args:
      VITE_APP_NAME: ${VITE_APP_NAME:-Kossuma Kota Bogor}

x-app-env: &app-env
  env_file:
    - .env.production

services:
  mysql:
    image: mysql:8.4
    container_name: kossuma-mysql
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kossuma}
      MYSQL_USER: ${DB_USERNAME:-kossuma}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kossuma_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-kossuma_root_secret}
      TZ: Asia/Jakarta
    volumes:
      - kossuma_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/zz-kossuma.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - kossuma_net

  migrate:
    <<: [*app-image, *app-env]
    container_name: kossuma-migrate
    restart: "no"
    command: ["init"]
    volumes:
      - kossuma_storage:/var/www/html/storage
      - kossuma_public:/var/www/public-shared
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kossuma_net

  app:
    <<: [*app-image, *app-env]
    container_name: kossuma-app
    restart: unless-stopped
    command: ["app"]
    volumes:
      - kossuma_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - kossuma_net

  nginx:
    image: nginx:1.27-alpine
    container_name: kossuma-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - kossuma_public:/var/www/html/public:ro
      - kossuma_storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kossuma_net

  queue:
    <<: [*app-image, *app-env]
    container_name: kossuma-queue
    restart: unless-stopped
    user: www-data
    command: ["queue"]
    stop_grace_period: 30s
    volumes:
      - kossuma_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - kossuma_net

  scheduler:
    <<: [*app-image, *app-env]
    container_name: kossuma-scheduler
    restart: unless-stopped
    user: www-data
    command: ["scheduler"]
    stop_grace_period: 15s
    volumes:
      - kossuma_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - kossuma_net

  adminer:
    image: adminer:4
    container_name: kossuma-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha-dark
    ports:
      - "${ADMINER_BIND_HOST:-127.0.0.1}:${ADMINER_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kossuma_net

networks:
  kossuma_net:
    driver: bridge

volumes:
  kossuma_mysql_data:
  kossuma_storage:
  kossuma_public:
